# Signs one tak3 release into this apt repository.
#
# This repository is public, and this is the only place the signing key
# lives: in the "apt" environment, which waits for the owner's approval before
# the job can see it. The private repository where tak3 is built holds no
# signing material; its release workflow only asks for this one to run (with
# a token that can start workflows here and do nothing else), and anyone can
# also start it by hand from Actions › publish › Run workflow.
#
# What it does, after approval: downloads the release's packages from the
# private repository (a read-only token), checks them against the release's
# own SHA256SUMS, adds them to the suite (stable, or testing for a
# pre-release), signs, and publishes to the host or hosts APT_PUBLISH_TO names
# (below). This branch keeps only the workflows, the scripts and the docs; the
# packages never enter its history.
#
# Settings this needs, in the "apt" environment (Settings › Environments), and
# the same secrets in "apt-testing" (no reviewer; deployment branches: main):
#   required reviewer   the owner; deployment branches: main only
#   APT_SIGNING_KEY     the armoured private key (gpg --armor --export-secret-keys)
#   APT_SIGNING_PASSPHRASE  its passphrase, if it has one
#   RELEASES_TOKEN      fine-grained token: Contents read-only on the private repository
# and as repository variables:
#   APT_URL             where customers reach this, e.g. https://apt.example.com
#   APT_PUBLISH_TO      pages (or unset): the gh-pages branch, as it always was
#                       both: the S3 bucket is the copy that counts; gh-pages
#                       gets the same files, so Pages can take over again
#                       s3: the S3 bucket only
#   APT_S3_BUCKET, APT_S3_REGION, APT_CDN_URL  see s3.sh
#   APT_AWS_ROLE        the role this job takes on, with no stored password:
#                       AWS trusts GitHub's word that this is the "apt" or
#                       "apt-testing" environment of this repository
# MOVING-HOST.md has the move from one to the next, and back.
name: publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.2.0 or v1.2.0-beta.1"
        required: true
      source:
        description: "Repository the release is in"
        required: true

permissions:
  contents: write
  id-token: write # only for the AWS role; grants nothing on GitHub

# One at a time: two releases must not both rewrite what is published at once.
# The mirror workflow shares this group.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # A pre-release (a tag with a dash) goes to the testing suite through the
    # "apt-testing" environment, which has the same secrets but no reviewer:
    # release candidates reach the test box without a tap. A stable release
    # still waits for the owner in "apt" (Tap 3).
    environment: ${{ contains(inputs.tag, '-') && 'apt-testing' || 'apt' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Check the request
        env:
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.source }}
          PUBLISH_TO: ${{ vars.APT_PUBLISH_TO }}
        run: |
          case "$PUBLISH_TO" in
            ""|pages|both|s3) ;;
            *) echo "::error::APT_PUBLISH_TO is $PUBLISH_TO; it must be pages, both or s3"; exit 1 ;;
          esac
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]] \
            || { echo "::error::$TAG is not a release tag"; exit 1; }
          [[ $SOURCE =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] \
            || { echo "::error::$SOURCE is not a repository"; exit 1; }

      - name: Fetch the release and check it
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.source }}
        run: |
          [ "$(gh release view "$TAG" --repo "$SOURCE" --json isDraft --jq .isDraft)" = false ] \
            || { echo "::error::$TAG is not a published release in $SOURCE"; exit 1; }
          mkdir -p "$RUNNER_TEMP/debs"
          gh release download "$TAG" --repo "$SOURCE" --dir "$RUNNER_TEMP/debs" --pattern '*.deb' --pattern SHA256SUMS
          cd "$RUNNER_TEMP/debs"
          # GitHub stores an uploaded file's ~ as a dot, so a pre-release's
          # tak3-node_1.1.0~rc.1_amd64.deb downloads as tak3-node_1.1.0.rc.1_amd64.deb.
          # Give each file back the name SHA256SUMS lists, the package's own,
          # before checking it.
          while read -r _ name; do
            got=${name//\~/.}
            if [ "$got" != "$name" ] && [ -f "$got" ]; then mv -- "$got" "$name"; fi
          done < SHA256SUMS
          ls ./*.deb >/dev/null
          sha256sum --check --ignore-missing SHA256SUMS

      - name: Take on the AWS role
        if: ${{ vars.APT_PUBLISH_TO == 'both' || vars.APT_PUBLISH_TO == 's3' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.APT_AWS_ROLE }}
          aws-region: ${{ vars.APT_S3_REGION }}

      - name: Fetch what is published now
        env:
          REPOSITORY: ${{ github.repository }}
          PUBLISH_TO: ${{ vars.APT_PUBLISH_TO }}
          GH_TOKEN: ${{ github.token }}
          APT_S3_BUCKET: ${{ vars.APT_S3_BUCKET }}
        run: |
          SITE="$RUNNER_TEMP/site"
          if [ "$PUBLISH_TO" = both ] || [ "$PUBLISH_TO" = s3 ]; then
            bash s3.sh pull "$SITE" "$RUNNER_TEMP/site.before"
            # An empty bucket is one nobody filled, not a repository with nothing
            # in it: publishing would hide every release customers have.
            ls "$SITE"/dists/*/InRelease >/dev/null 2>&1 \
              || { echo "::error::the bucket holds no repository; run the mirror workflow first"; exit 1; }
          else
            # Or nothing on the first release.
            git clone --quiet --depth 1 --branch gh-pages \
              "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" "$SITE" 2>/dev/null \
              || { mkdir -p "$SITE" && git -C "$SITE" init --quiet -b gh-pages \
                   && git -C "$SITE" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"; }
          fi

      - name: Sign
        id: sign
        env:
          TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
          PUBLISH_TO: ${{ vars.APT_PUBLISH_TO }}
          APT_URL: ${{ vars.APT_URL }}
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_KEY_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        run: |
          VERSION=${TAG#v}
          SUITE=stable
          [[ $VERSION == *-* ]] && SUITE=testing
          # Two releases back on stable, so a bad one can be undone with
          # apt install tak3-node=<previous>; one on testing. Each release is
          # about 260 MB, and Pages stops at 1 GB while it is still in use.
          KEEP=2
          [ "$SUITE" = testing ] && KEEP=1
          sudo apt-get update -qq && sudo apt-get install -y -qq dpkg-dev apt-utils gpgv >/dev/null

          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --quiet --import
          APT_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          [ -n "$APT_KEY_ID" ] || { echo "::error::APT_SIGNING_KEY holds no secret key"; exit 1; }
          export APT_KEY_ID
          OWNER=${REPOSITORY%%/*}
          export APT_URL=${APT_URL:-https://${OWNER,,}.github.io/${REPOSITORY#*/}}

          SITE="$RUNNER_TEMP/site"
          if [ "$PUBLISH_TO" = both ] || [ "$PUBLISH_TO" = s3 ]; then
            bash s3.sh verify "$SITE"
          fi
          bash apt-repo.sh "$SITE" "$SUITE" "$KEEP" "$RUNNER_TEMP"/debs/*.deb
          rm -rf "$GNUPGHOME"

      # Each host gets its copy whatever happened to the other: while both are
      # in use, a failure at one must not leave the other a release behind. The
      # job still fails, so it gets seen and re-run.
      - name: Upload to S3
        if: ${{ !cancelled() && steps.sign.outcome == 'success' && (vars.APT_PUBLISH_TO == 'both' || vars.APT_PUBLISH_TO == 's3') }}
        env:
          TAG: ${{ inputs.tag }}
          APT_URL: ${{ vars.APT_URL }}
          APT_S3_BUCKET: ${{ vars.APT_S3_BUCKET }}
          APT_CDN_URL: ${{ vars.APT_CDN_URL }}
        run: |
          bash s3.sh push "$RUNNER_TEMP/site" "$RUNNER_TEMP/site.before"
          echo "published tak3 ${TAG#v} to the bucket, $APT_URL once the name points there"

      - name: Replace the gh-pages branch
        if: ${{ !cancelled() && steps.sign.outcome == 'success' && vars.APT_PUBLISH_TO != 's3' }}
        env:
          TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
          PUBLISH_TO: ${{ vars.APT_PUBLISH_TO }}
          APT_URL: ${{ vars.APT_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${TAG#v}
          SUITE=stable
          [[ $VERSION == *-* ]] && SUITE=testing
          cd "$RUNNER_TEMP/site"
          if [ "$PUBLISH_TO" = both ]; then
            # These files came from the bucket, which has no git and no CNAME.
            # Pages drops its custom domain if the CNAME file goes.
            git init --quiet -b gh-pages
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
            host=${APT_URL#*://}
            printf '%s' "${host%%/*}" > CNAME
          fi
          git config user.name "tak3 release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --quiet --orphan publish
          git add -A
          git commit --quiet -m "tak3 $VERSION ($SUITE)"
          git push --quiet --force origin publish:gh-pages
          echo "published tak3 $VERSION to gh-pages ($SUITE)"
